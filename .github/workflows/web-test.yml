name: Web Test

on:
  push:
    paths:
      - 'JPPhotoManagerWeb/**'
  pull_request:
    paths:
      - 'JPPhotoManagerWeb/**'

jobs:
  backend:
    name: Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn clean package -DskipTests
        working-directory: JPPhotoManagerWeb/backend

      - name: Test
        run: mvn test
        working-directory: JPPhotoManagerWeb/backend

  frontend:
    name: Frontend (Angular 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: JPPhotoManagerWeb/frontend/package-lock.json

      # Cypress's own binary (Electron) lives outside node_modules and isn't
      # covered by setup-node's npm cache - cache it separately so CI doesn't
      # re-download ~150MB on every run. Keyed on the pinned cypress version
      # in package-lock.json so a version bump naturally invalidates it.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('JPPhotoManagerWeb/frontend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: JPPhotoManagerWeb/frontend

      - name: Run unit/component tests (Cypress)
        run: npm run test
        working-directory: JPPhotoManagerWeb/frontend

      - name: Run mocked E2E smoke tests
        run: npm run test:e2e:mocked
        working-directory: JPPhotoManagerWeb/frontend

      - name: Build
        run: npm run build:prod
        working-directory: JPPhotoManagerWeb/frontend

      - name: Verify build output
        run: test -d dist/jp-photo-manager-ui/browser && [ "$(ls -A dist/jp-photo-manager-ui/browser)" ]
        working-directory: JPPhotoManagerWeb/frontend

